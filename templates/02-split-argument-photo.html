      <section data-label="{{label}}" style="background:var(--bg);color:var(--fg);overflow:hidden;">{{{banner}}}
        <div style="position:absolute;inset:0;padding:132px 60px 104px 144px;display:grid;grid-template-columns:1.04fr 0.96fr;gap:52px;align-items:stretch;">
          <div style="display:flex;flex-direction:column;min-width:0;">
            <div style="display:flex;align-items:center;gap:24px;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--mute);white-space:nowrap;">
              <span style="width:44px;height:1px;background:var(--fg);display:inline-block;"></span>{{eyebrow}}
            </div>
            <h2 style="margin:24px 0 0;font-weight:800;font-size:{{headline_size}}px;line-height:0.92;letter-spacing:-0.035em;text-transform:uppercase;">{{{headline}}}</h2>
            <div style="margin:26px 0 0;max-width:760px;display:flex;flex-direction:column;gap:12px;font-size:20px;line-height:1.44;color:var(--dim);">
{{{paras}}}
            </div>
            <div style="margin-top:auto;display:flex;flex-direction:column;gap:16px;">
              <div style="display:grid;grid-template-columns:repeat({{stat_count}},1fr);border-top:1px solid var(--line);">
{{{stats}}}
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;border-top:1px solid var(--line);padding-top:18px;">
                <div>
                  <div style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);">{{meta_left_label}}</div>
                  <p style="margin:10px 0 0;font-weight:600;font-size:18px;line-height:1.4;letter-spacing:-0.01em;">{{{meta_left_text}}}</p>
                </div>
                <div>
                  <div style="font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);">{{meta_right_label}}</div>
                  <div style="margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg);line-height:1.5;">{{{meta_right_text}}}</div>
                </div>
              </div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;min-width:0;">
            <div style="position:relative;flex:1;border:1px solid var(--line);overflow:hidden;background:var(--panel-2);min-height:0;">
              <img src="{{photo_src}}" style="width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);" alt="{{photo_alt}}">
            </div>
            <div style="margin-top:14px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--mute);">{{photo_caption}}</div>
          </div>
        </div>
      </section>
