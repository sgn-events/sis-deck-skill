      <section data-label="{{label}}" data-theme="dark" data-no-banner="" style="overflow:hidden;color:var(--fg);background:#0b0b0d;">
        <img src="{{photo_src}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{photo_position}};" alt="{{photo_alt}}">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,10,0.8) 0%,rgba(8,8,10,0.35) 34%,rgba(8,8,10,0.62) 58%,rgba(8,8,10,0.92) 100%);"></div>
        <div style="position:absolute;inset:0;padding:92px 144px 104px;display:flex;flex-direction:column;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;">
            <img src="{{lockup_src}}" alt="{{event}}" style="height:75px;width:auto;display:block;">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.7;padding-top:6px;">{{{kicker}}}</div>
          </div>
          <h1 style="margin:auto 0 0;font-weight:800;font-size:{{headline_size}}px;line-height:0.9;letter-spacing:-0.035em;text-transform:uppercase;max-width:1480px;">{{{headline}}}</h1>
          <p style="margin:28px 0 0;max-width:1040px;font-size:24px;line-height:1.5;color:var(--dim);">{{{lead}}}</p>
          <div style="margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,0.28);border-bottom:1px solid rgba(255,255,255,0.28);font-family:'IBM Plex Mono',monospace;font-size:21px;letter-spacing:0.14em;text-transform:uppercase;">
            <div style="padding:24px 6px;color:var(--dim);">{{fact_left}}</div>
            <div style="padding:24px 24px;text-align:center;border-left:1px solid rgba(255,255,255,0.28);color:var(--fg);font-weight:600;">{{fact_center}}</div>
            <div style="padding:24px 6px;text-align:right;border-left:1px solid rgba(255,255,255,0.28);color:var(--dim);">{{fact_right}}</div>
          </div>
        </div>
      </section>
