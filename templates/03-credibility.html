      <section data-label="{{label}}" style="background:var(--bg);color:var(--fg);overflow:hidden;">{{{banner}}}
        <div style="position:absolute;inset:0;padding:104px 0 88px;display:grid;grid-template-columns:0.86fr 1px 1.14fr;">
          <div style="padding:22px 64px 0 144px;display:flex;flex-direction:column;">
            <div style="display:flex;align-items:center;gap:24px;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--mute);white-space:nowrap;">
              <span style="width:44px;height:1px;background:var(--fg);display:inline-block;"></span>{{eyebrow}}
            </div>
            <h2 style="margin:28px 0 0;font-weight:800;font-size:{{headline_size}}px;line-height:0.92;letter-spacing:-0.035em;text-transform:uppercase;">{{{headline}}}</h2>
            <div style="margin-top:44px;">
              <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);">{{thumbs_label}}</div>
              <div style="margin-top:16px;display:grid;grid-template-columns:repeat({{thumb_columns}},1fr);gap:12px;">
{{{thumbs}}}
              </div>
            </div>
            <div style="margin-top:auto;">
              <img src="{{parent_logo_src}}" alt="{{parent_logo_alt}}" style="display:block;width:auto;height:96px;max-width:100%;">
              <div style="margin-top:18px;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:0.52em;text-transform:uppercase;color:var(--dim);padding-left:5px;">{{parent_wordmark}}</div>
            </div>
          </div>
          <div style="background:var(--line);"></div>
          <div style="padding:22px 144px 0 76px;display:flex;flex-direction:column;justify-content:center;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:44px;">
{{{paras}}}
            </div>
            <div style="margin-top:48px;display:flex;flex-direction:column;">
{{{figure_rows}}}
            </div>
          </div>
        </div>
      </section>
