            <figure style="margin:0;display:flex;flex-direction:column;min-height:0;"><div style="position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);"><img src="{{photo_src}}" style="width:100%;height:100%;object-fit:cover;object-position:{{photo_position}};{{crop}}filter:grayscale(1) contrast(1.04);" alt="{{photo_alt}}"><span style="position:absolute;top:9px;left:9px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;text-shadow:0 0 3px rgba(0,0,0,0.9),0 1px 2px rgba(0,0,0,0.6);">[{{index}}]</span></div><div style="margin-top:9px;flex:0 0 auto;"><div style="font-weight:700;font-size:17px;letter-spacing:-0.01em;line-height:1.1;">{{name}}</div><div style="margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.03em;text-transform:uppercase;color:var(--mute);line-height:1.3;">{{role}}</div><div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--dim);line-height:1.3;">{{org}}</div></div></figure>
