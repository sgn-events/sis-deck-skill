      <section data-label="{{label}}" style="background:var(--bg);color:var(--fg);overflow:hidden;">{{{banner}}}
        <div style="position:absolute;inset:0;padding:96px 144px 72px;display:grid;grid-template-columns:1.32fr 1px 0.86fr;gap:0;">
          <div style="padding-right:64px;display:flex;flex-direction:column;min-width:0;">
            <div style="display:flex;align-items:center;gap:24px;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--mute);white-space:nowrap;">
              <span style="width:44px;height:1px;background:var(--fg);display:inline-block;"></span>{{eyebrow}}
            </div>
            <h2 style="margin:22px 0 0;font-weight:800;font-size:{{headline_size}}px;line-height:0.9;letter-spacing:-0.035em;text-transform:uppercase;">{{{headline}}}</h2>
            <p style="margin:18px 0 0;max-width:820px;font-size:20px;line-height:1.5;color:var(--dim);">{{{lead}}}</p>
            <div style="margin-top:30px;flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:space-evenly;align-items:center;justify-content:center;gap:26px 56px;padding:8px 0;">
{{{logos}}}
            </div>
          </div>
          <div style="background:var(--line);"></div>
          <div style="padding-left:64px;display:flex;flex-direction:column;justify-content:center;min-width:0;">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);">{{quotes_label}}</div>
            <div style="margin-top:22px;display:flex;flex-direction:column;gap:16px;">
{{{quotes}}}
            </div>
          </div>
        </div>
      </section>
